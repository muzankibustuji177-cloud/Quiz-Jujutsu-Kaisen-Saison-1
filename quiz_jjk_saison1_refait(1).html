function pick(n,b){if(locked)return;locked=true;let x=Q[i],all=[...document.querySelectorAll(".answer")],f=document.getElementById("feedback");if(n===x.c){s++;b.classList.add("correct");f.className="feedback good";f.textContent="✓ Correct ! "+x.e}else{b.classList.add("wrong");all[x.c].classList.add("correct");f.className="feedback bad";f.textContent="✗ Oups ! "+x.e}document.getElementById("live").textContent=`Score : ${s}`;document.getElementById("bar").style.width=`${(i+1)/15*100}%`;setTimeout(()=>{if(++i===15)finish();else draw()},1250)}
